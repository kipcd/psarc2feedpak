[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "psarc2feedpak"
version = "0.2.0"
description = "Convert Rocksmith 2014 .psarc custom songs to got-feedBack .feedpak packages"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "construct>=2.10",
    "cryptography>=3.4",
]

[project.scripts]
psarc2feedpak = "psarc2feedpak.__main__:main"

[project.gui-scripts]
psarc2feedpak-gui = "psarc2feedpak.gui:main"

[project.urls]
Homepage = "https://github.com/carelesshangman/psarc2feedpak"

[tool.setuptools]
packages = ["psarc2feedpak"]
