name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build deps
        run: pip install pyinstaller construct cryptography

      - name: Fetch bundled tools (vgmstream + ffmpeg)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force tools/vgmstream | Out-Null
          Invoke-WebRequest https://github.com/vgmstream/vgmstream/releases/latest/download/vgmstream-win64.zip -OutFile vgmstream.zip
          Expand-Archive vgmstream.zip -DestinationPath tools/vgmstream -Force
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-dl -Force
          Copy-Item (Get-ChildItem ffmpeg-dl -Recurse -Filter ffmpeg.exe).FullName tools/ffmpeg.exe

      - name: Build
        run: pyinstaller --noconfirm packaging/psarc2feedpak.spec

      - name: Bundle tools next to the app
        shell: pwsh
        run: Copy-Item tools dist/psarc2feedpak/tools -Recurse

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/psarc2feedpak/* -DestinationPath "psarc2feedpak-${{ github.ref_name }}-win64.zip"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: psarc2feedpak-*-win64.zip
          generate_release_notes: true
